dialog{width:min(450px,calc(100% - 30px));max-height:calc(100% - 24px);padding:22px;border:1px solid var(--control);border-radius:14px;background:var(--panel);color:var(--text)}

@media(max-width:790px){.main{margin-left:0}.sidebar{transform:translateX(-110%);transition:transform .18s ease}.sidebar[data-open=true]{transform:translateX(0)}.sidebar:not([data-open=true]){visibility:hidden}.menu-btn{display:inline-flex}.overlay:not([hidden]){display:block;position:fixed;inset:0;z-index:45;background:#19181691;border:0;width:100%;height:100%}}

const originalMock = [
  {
    id:"10783", title:"Odd Sum", lesson:5, date:"2014-05-27",
    task:"Write a program that adds all odd integers in the inclusive interval from a to b. Include an endpoint if it is odd.",

  if (className) node.className = className;
  return node;
};

function draw() {
  const pool = candidates.slice();
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, SIZE);
}
const empty = () => ({ ids:draw(), started:0, finished:0, last:0, timedOut:false, entries:Array.from({length:SIZE}, () => ({draft:"", output:""})) });
const routeFor = i => "p" + (i + 1);

const normalize = text => text.replace(/\r\n?/g, "\n").replace(/[ \t]+$/gm, "").replace(/\n+$/, "");
let state = empty();
let storageOK = true;
let current = "";
let confirmTask = null;
try {
  let saved = JSON.parse(localStorage.getItem(KEY));
  if (!saved) {
    const old = JSON.parse(localStorage.getItem(LEGACY));
    if (old?.started) saved = {...old, ids:originalMock.map(p => p.id)};
  }
  if (saved && Array.isArray(saved.entries) && saved.entries.length === SIZE &&
      Array.isArray(saved.ids) && saved.ids.length === SIZE &&
      new Set(saved.ids).size === SIZE && saved.ids.every(id => candidates.includes(id))) {
    state = {
      ids:saved.ids,
      started:Number.isFinite(saved.started) && saved.started > 0 ? saved.started : 0,
      finished:Number.isFinite(saved.finished) && saved.finished > 0 ? saved.finished : 0,
      last:Number.isInteger(saved.last) && saved.last >= 0 && saved.last < SIZE ? saved.last : 0,
      timedOut:saved.timedOut === true,
      entries:saved.entries.map(e => ({draft:typeof e?.draft === "string" ? e.draft : "", output:typeof e?.output === "string" ? e.output : ""}))
    };
  }
} catch { storageOK = false; }
let problems = state.ids.map(id => byId.get(id));

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); storageOK = true; }

}
function entered(i) { return state.entries[i].output.trim().length > 0; }
function countEntered() { return problems.filter((_, i) => entered(i)).length; }

  $("#progress-number").textContent = count + " / " + problems.length;
  $("#progress-bar").value = count;
  $("#storage-status").textContent = storageOK ? "Drafts are saved in this browser." : "Local storage is unavailable. Keep this page open to retain drafts.";
  document.querySelectorAll("[data-mark]").forEach(el => {
    const i = Number(el.dataset.mark);
    el.textContent = state.finished ? (result(i)[0] === "Match" ? "✓" : "·") : (entered(i) ? "✓" : "");
  });
}
function clock() {
  const remaining = state.started ? LIMIT - ((state.finished || Date.now()) - state.started) : LIMIT;
  const total = Math.ceil(Math.max(0, Math.min(LIMIT, remaining)) / 1000);
  const hours = Math.floor(total / 3600);
  $("#elapsed").textContent = two(hours) + ":" + two(Math.floor(total / 60) % 60) + ":" + two(total % 60);
}
function initNav() {
  const nav = $("#problem-nav");
  nav.replaceChildren();
  problems.forEach((p, i) => {
    const link = make("a", "", "nav-link");
    link.href = "#" + routeFor(i);
    link.dataset.route = routeFor(i);
    const mark = make("span", "", "nav-mark");
    mark.dataset.mark = i;
    mark.setAttribute("aria-hidden", "true");
    link.append(make("span", two(i + 1), "nav-num"), make("span", p.title), mark);
    nav.append(link);
  });
}
function updateNav() {
  document.querySelectorAll(".nav-link[data-route]").forEach(link => {
    if (link.dataset.route === current) link.setAttribute("aria-current", "page");
    else link.removeAttribute("aria-current");
  });
  $("#review-nav").hidden = !state.finished;
  updateProgress();
  clock();
}
function ask(title, message, label, task) {
  $("#confirm-title").textContent = title;
  $("#confirm-message").textContent = message;
  $("#confirm-action").textContent = label;
  dialog.returnValue = "cancel";
  confirmTask = task;
  dialog.showModal();
}
dialog.addEventListener("close", () => {
  const task = confirmTask;
  confirmTask = null;
  if (dialog.returnValue === "yes" && task) task();
});
function finish() {
  if (state.finished) return;
  const count = countEntered();
  ask("Finish this attempt?", "You entered " + count + " of 4 self-check outputs. Finish to lock your answers and open the explanations.", "Finish and review", endAttempt);
}
function endAttempt() {
  if (state.finished) return;
  const now = Date.now();
  state.started ||= now;
  state.timedOut = now >= state.started + LIMIT;
  state.finished = Math.min(now, state.started + LIMIT);
  save();
  if (location.hash === "#review") render(true);
  else location.hash = "review";
}
function tick() {
  if (state.started && !state.finished && Date.now() >= state.started + LIMIT) {
    if (dialog.open) {
      confirmTask = null;
      dialog.close("cancel");
    }
    endAttempt();
  }
  clock();
}
function reset() {
  ask("Draw a new set?", "This replaces this attempt and its drafts with a fresh draw of four questions.", "Draw a new set", () => {
    state = empty();
    problems = state.ids.map(id => byId.get(id));
    initNav();
    save();
    if (location.hash === "#overview" || !location.hash) render();
    else location.hash = "overview";
  });
}
function showOverview() {
  page.replaceChildren($("#overview-template").content.cloneNode(true));
  const start = $("[data-start]", page);
  if (state.finished) { start.href = "#review"; start.textContent = "Review this attempt"; }
  else if (state.started) { start.href = "#" + routeFor(state.last); start.textContent = "Resume timed mock"; }
  problems.forEach((p, i) => {
    const link = make("a");
    link.href = "#" + routeFor(i);
    link.append(make("span", two(i + 1), "nav-num"), make("span", p.title), make("span", "UVa " + p.id, "index-id"));
    const li = make("li");
    li.append(link);
    $("[data-index]", page).append(li);
  });
  $("[data-finish]", page).hidden = !state.started || !!state.finished;
  $("[data-finish]", page).onclick = finish;
  $("[data-reset]", page).hidden = false;
  $("[data-reset]", page).onclick = reset;
}
function table(trace) {
  const wrap = make("div", "", "table-wrap");
  const grid = make("table"), top = make("thead"), head = make("tr"), body = make("tbody");
  trace.headers.forEach(label => {
    const th = make("th", label);
    th.scope = "col";
    head.append(th);
  });
  top.append(head);
  trace.rows.forEach(values => {
    const row = make("tr");
    values.forEach(value => row.append(make("td", value)));
    body.append(row);
  });
  grid.append(top, body);
  wrap.append(grid);
  return wrap;
}
function details(label, children) {
  const panel = make("details"), body = make("div", "", "detail-body");
  body.append(...children);
  panel.append(make("summary", label), body);
  return panel;
}
function originalURL(p) {
  return "https://onlinejudge.org/external/" + Math.floor(Number(p.id) / 100) + "/" + p.id + ".pdf";
}
function archiveURL(p) {
  const base = "https://cpe.mcu.edu.tw/cpe/test_data/";
  return p.date && p.date >= "2013-10-01" ? base + p.date : base + "problems";
}
function external(label, href) {
  const link = make("a", label);
  link.href = href;
  link.target = "_blank";
  link.rel = "noopener";
  return link;
}
function solutionPanels(p) {
  const lines = make("ol");
  p.steps.forEach(step => lines.append(make("li", step)));
  return [
    details("Walk through the algorithm", [lines, table(p.trace)]),
    details("Reference solution · C++11", [make("pre", p.code.join("\n"))])
  ];
}
function showBank() {
  const intro = make("section", "", "section");
  const heading = make("h1", "Problem bank");
  heading.tabIndex = -1;
  const inMock = state.started && !state.finished;
  intro.append(make("div", "COMPUTER LAB · 13 PROBLEMS", "eyebrow"), heading,
    make("p", "All 13 problems taught in Labs 5–8, grouped in class order. The archived CPE date beside each title identifies a documented appearance."));
  intro.append(make("p", "UVa 10055 is in the course handout. No appearance was found in the official sessions checked, so it is available here for study and is outside this mock’s draw."));
  if (inMock) intro.append(make("p", "Study solutions stay hidden until you finish the current mock.", "notice"));
  page.replaceChildren(intro);
  for (let lab = 5; lab <= 8; lab++) {
    const group = make("section", "", "section bank-group");
    const items = bank.filter(p => p.lesson === lab);
    group.append(make("div", items.length + (items.length === 1 ? " PROBLEM" : " PROBLEMS"), "eyebrow"), make("h2", "Lab " + lab));
    for (const p of items) {
      const panel = make("details", "", "bank-problem");
      const title = make("summary");
      title.append(make("span", "UVa " + p.id + " · " + p.title), make("span", p.date ? "CPE " + p.date : "Class exercise", "pill"));
      const body = make("div", "", "detail-body");
      body.append(make("p", "Course handout: Lab " + lab + ", page " + p.page + ".", "section-note"), make("p", p.task));
      const spec = make("div", "", "specs");
      for (const [label, description] of [["Input",p.input],["Output",p.output]]) {
        const card = make("div", "", "card");
        card.append(make("h3", label), make("p", description));
        spec.append(card);
      }
      const samples = make("div", "", "sample-grid");
      for (const [label, value] of [["SAMPLE INPUT",p.sampleIn],["SAMPLE OUTPUT",p.sampleOut]]) {
        const item = make("div");
        item.append(make("div", label, "block-label"), make("pre", value));
        samples.append(item);
      }
      const links = make("p", "", "problem-links section-note");
      links.append(external("Original English statement", originalURL(p)));
      if (p.date) links.append(document.createTextNode(" · "), external("CPE archive record", archiveURL(p)));
      body.append(spec, samples, links);
      if (!inMock) body.append(...solutionPanels(p));
      panel.append(title, body);
      group.append(panel);
    }
    page.append(group);
  }
}
function feedback(p, i) {
  const [status, tone] = result(i);
  const wrap = make("div");
  const note = make("div", "", "notice");
  note.append(make("strong", status, tone));
  if (status === "Needs review") {
    const wanted = normalize(p.checkOut).split("\n"), given = normalize(state.entries[i].output).split("\n");
    const at = Array.from({length:Math.max(wanted.length, given.length)}, (_, k) => k).find(k => wanted[k] !== given[k]);
    note.append(make("p", "First difference on line " + (at + 1) + ". Compare line breaks, spelling, and punctuation."));
  } else if (status === "Match") {
    note.append(make("p", "Your text matches the supplied self-check output."));
  } else {
    note.append(make("p", "You can compare your program with the answer below."));
  }
  wrap.append(note);
  wrap.append(
    details("Expected self-check output", [make("pre", p.checkOut)]),
    ...solutionPanels(p)
  );
  return wrap;
}
function download(i) {
  const draft = state.entries[i].draft;
  if (!draft.trim()) return;
  const url = URL.createObjectURL(new Blob([draft], {type:"text/plain;charset=utf-8"}));
  const a = make("a");
  a.href = url;
  a.download = "uva-" + problems[i].id + ".cpp";
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function showProblem(i) {
  const p = problems[i], entry = state.entries[i];
  if (!state.finished) {
    state.started ||= Date.now();
    state.last = i;
    save();
  }
  page.replaceChildren($("#problem-template").content.cloneNode(true));
  const texts = {
    "[data-kicker]":"PROBLEM " + two(i + 1) + " / 04 · UVA " + p.id + " · LAB " + p.lesson,
    "#problem-title":p.title, "[data-date]":"CPE " + p.date, "[data-task]":p.task, "[data-input]":p.input,
    "[data-output]":p.output, "[data-sample-in]":p.sampleIn, "[data-sample-out]":p.sampleOut, "[data-check-in]":p.checkIn
  };
  Object.entries(texts).forEach(([selector, value]) => $(selector, page).textContent = value);
  $("[data-original]", page).href = originalURL(p);
  $("[data-archive]", page).href = archiveURL(p);
  const draft = $("#draft"), answer = $("#answer"), downloadBtn = $("#download-draft");
  draft.value = entry.draft;
  answer.value = entry.output;
  draft.readOnly = answer.readOnly = !!state.finished;
  downloadBtn.disabled = !entry.draft.trim();
  downloadBtn.onclick = () => download(i);
  if (!state.finished) {
    draft.oninput = () => { entry.draft = draft.value; downloadBtn.disabled = !entry.draft.trim(); save(); updateProgress(); };
    answer.oninput = () => { entry.output = answer.value; save(); updateProgress(); };
  } else {
    $("[data-feedback]", page).append(feedback(p, i));
  }
  const prev = $("[data-prev]", page), next = $("[data-next]", page), finishBtn = $("[data-finish]", page);
  prev.href = i > 0 ? "#" + routeFor(i - 1) : "#overview";
  prev.textContent = i > 0 ? "Previous problem" : "Overview";
  if (i < problems.length - 1) next.href = "#" + routeFor(i + 1);
  else if (state.finished) { next.href = "#review"; next.textContent = "Back to review"; }
  else { next.hidden = true; finishBtn.classList.add("primary"); }
  finishBtn.hidden = !!state.finished;
  finishBtn.onclick = finish;
}
function showReview() {
  const section = make("section", "", "section");
  const h = make("h1", "Review your attempt");
  h.tabIndex = -1;
  const matches = problems.filter((_, i) => result(i)[0] === "Match").length;
  section.append(make("div", "EXAM REVIEW", "eyebrow"), h,
    make("p", matches + " of 4 self-check outputs match. This is a text check on the supplied inputs."),
    make("p", "Open a problem to see its expected output, trace, and C++ reference solution."));
  if (state.timedOut) section.append(make("p", "Time is up. Your drafts and outputs were saved.", "notice"));
  const list = make("ol", "", "review-list");
  problems.forEach((p, i) => {
    const link = make("a");
    link.href = "#" + routeFor(i);
    const [status, tone] = result(i);
    link.append(make("strong", two(i + 1) + "  " + p.title), make("small", status, tone));
    const row = make("li"); row.append(link); list.append(row);
  });
  const actions = make("div", "", "actions"), restart = make("button", "Start a new attempt", "button");
  restart.type = "button";
  restart.onclick = reset;
  actions.append(restart);
  section.append(list, actions);
  page.replaceChildren(section);
}
const narrow = matchMedia("(max-width: 790px)");
function setMenu(open, restore = false) {
  $("#sidebar").dataset.open = String(open);
  $("#menu").setAttribute("aria-expanded", String(open));
  $("#overlay").hidden = !open;
  if (open) $(".nav-link[aria-current=page]")?.focus();
  if (restore) $("#menu").focus();
}
function render(focus = false) {
  const hash = location.hash.slice(1);
  if ((hash === "problem-index" || hash === "main") && current) return;
  const index = /^p[1-4]$/.test(hash) ? Number(hash.slice(1)) - 1 : -1;
  current = index >= 0 ? hash : hash === "bank" ? "bank" : (hash === "review" && state.finished ? "review" : "overview");
  if (index >= 0) showProblem(index);
  else if (current === "review") showReview();
  else if (current === "bank") showBank();
  else showOverview();
  $("#crumb").textContent = index >= 0 ? "Problem " + two(index + 1) + " of 04" : current === "review" ? "Review" : current === "bank" ? "Problem bank" : "Midterm mock";
  setMenu(false);
  updateNav();
  if (focus) {
    window.scrollTo(0, 0);
    $("h1", page)?.focus({preventScroll:true});
  }
}
$("#menu").onclick = () => setMenu($("#sidebar").dataset.open !== "true");
$("#overlay").onclick = () => setMenu(false, true);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#sidebar").dataset.open === "true") setMenu(false, true);
});
$("#sidebar").addEventListener("click", e => {
  if (narrow.matches && e.target.closest("a")) setMenu(false);
});
narrow.addEventListener("change", () => setMenu(false));
function setTheme(dark) {
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $("#theme").setAttribute("aria-pressed", String(dark));
  $("#theme").title = dark ? "Use light theme" : "Use dark theme";
}
let dark = false;
try { dark = (localStorage.getItem(KEY + "-theme") ?? localStorage.getItem(LEGACY + "-theme")) === "dark"; } catch {}
setTheme(dark);
$("#theme").onclick = () => {
  dark = !dark; setTheme(dark);
  try { localStorage.setItem(KEY + "-theme", dark ? "dark" : "light"); } catch {}
};
initNav();
save();
tick();
render();
window.addEventListener("hashchange", () => render(true));
setInterval(tick, 1000);
</script>
</body>
</html>
